# Builds the Linux AppImage for a release and attaches it to it, where the
# in-app updater finds it (asset name ending in -x86_64.AppImage).
# Releases are made from Windows with tools/release.sh; this runs when one is published.
name: Linux AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the AppImage to (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson build-essential libglm-dev libocct-ocaf-dev libocct-data-exchange-dev cmake \
            pkg-config libgtkmm-4.0-dev uuid-dev libeigen3-dev libspnav-dev python3-gi python3-gi-cairo \
            gir1.2-rsvg-2.0 pybind11-dev python3-dev libcurl4-openssl-dev patchelf desktop-file-utils curl
      - name: Build the AppImage
        run: tools/appimage.sh
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/Tavnit3D-*-x86_64.AppImage --clobber
